name: Postman API Automation Pipeline
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    
    workflow_dispatch:
    
jobs:
    api-automation:
        runs-on: ubuntu-latest
        steps:
            # Step 1: Download repository code
            - name: Checkout Repository
              uses: actions/checkout@v4
            
            # Step 2: Install Node.js
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20.x.x
            
            # Step 3: Install Newman and HTML reporter
            - name: Install Newman
              run: |
                npm install -g newman
                npm install -g newman-reporter-htmlextra
                
            # Step 4: Execute Postman Collection
            - name: Execute API Tests
              id: run-tests
              continue-on-error: true
              run: |
                rm -f newman/API_CI_CD-*.html
                newman run collections/API_CI_CD.postman_collection.json -e collections/CICD_QA.postman_environment.json -r htmlextra
                if ls newman/API_CI_CD-*.html 1> /dev/null 2>&1; then
                  echo "report_exists=true" >> $GITHUB_OUTPUT
                fi
            
            # Step 5: Upload HTML Report (Only if generated)
            - name: Publish API Test Reports
              if: steps.run-tests.outputs.report_exists == 'true'
              uses: actions/upload-artifact@v4
              with:
                name: Postman-API-Test-Report
                path: newman/API_CI_CD-*.html
