name: Postman API Automation Pipeline
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    
    workflow_dispatch:
    
jobs:
    api-automation:
        runs-on: ubuntu-latest
        steps:
            # Step 1: Download repository code
            - name: Checkout Repository
              uses: actions/checkout@v4
            
            # Step 2: Install Node.js
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20.x.x
            
            # Step 3: Install Newman and HTML reporter
            - name: Install Newman
              run: npm install -g newman
                npm install -g newman-reporter-htmlextra
                
            # Step 4: Create Report directory
            - name: Create Report Directory
              run: mkdir -p reports
            
            # Step 5: Execute Postman Collection
            - name: Execute API Tests
              run: newman run collections/API_CI_CD.postman_collection.json -e CICD_QA.postman_environment.json -r cli,htmlextra --reporter-htmlextra-export reports/API-Test_Report.html
            
            # Step 6: Upload HTML Report
            - name: Publish API Test Reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: Postman-API-Test-Report
                path: reports/API-Test-Report.html
                if-no-files-found: warn
